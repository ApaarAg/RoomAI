# RoomAI Phase 15: Porch Specialist Training Configuration
model_name: "exterior_specialist_porch_yolo11s"
task: "detect"
mode: "train"
model: "yolo11s.pt"
data: "data/exterior_specialist_porch/dataset.yaml"

epochs: 25
patience: 7
batch: 8
imgsz: 640
device: 0
workers: 2
seed: 42
deterministic: true
optimizer: "SGD"
lr0: 0.005
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentations
hsv_h: 0.015
hsv_s: 0.4
hsv_v: 0.3
degrees: 0.0
translate: 0.1
scale: 0.3
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.5
mixup: 0.0
copy_paste: 0.0

# Outputs
project: "runs/detect"
name: "exterior_specialist_porch_run"
save: true
save_period: -1
val: true
plots: true
