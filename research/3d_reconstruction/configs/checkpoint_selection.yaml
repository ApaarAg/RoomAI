# ==============================================================================
# ROOMAI — AUTOMATIC BEST CHECKPOINT SELECTION CONFIGURATION
# Mandatory empirical criteria and regression guardrails
# ==============================================================================

stage1_selection:
  primary_metric: "pointmap_score"
  mode: "min"
  formula: "0.5 * (val_accuracy / baseline_accuracy + val_completeness / baseline_completeness)"
  
  guardrails:
    depth_absrel:
      max_relative_regression_pct: 5.0
      direction: "lower_is_better"
    camera_rotation_error:
      max_relative_regression_pct: 5.0
      direction: "lower_is_better"
    normal_mean_angular_error:
      max_relative_regression_pct: 5.0
      direction: "lower_is_better"

stage2_selection:
  primary_metric: "nvs_composite_score"
  mode: "max"
  formula: "0.4 * (1.0 - val_lpips) + 0.3 * (val_psnr / baseline_psnr) + 0.3 * (val_ssim / baseline_ssim)"
  
  guardrails:
    pointmap_accuracy:
      max_relative_regression_pct: 5.0
      direction: "higher_is_better"
    geometry_consistency:
      max_relative_regression_pct: 5.0
      direction: "lower_is_better"

early_stopping:
  patience: 5                        # 5 validation evaluations without improvement
  min_delta: 0.005                   # Minimum 0.5% normalized improvement required
  check_finite: true                 # Reject any NaN or Inf metric

atomic_saving_protocol:
  temp_checkpoint_suffix: ".tmp.ckpt"
  verify_load_before_promotion: true
  compute_sha256_on_save: true
  preserve_previous_best_backup: true
  paths:
    pretrained_manifest: "research/3d_reconstruction/checkpoints/pretrained/pretrained_manifest.json"
    stage1_dir: "research/3d_reconstruction/checkpoints/stage1"
    stage2_dir: "research/3d_reconstruction/checkpoints/stage2"
    production_candidate_dir: "research/3d_reconstruction/checkpoints/production_candidate"

